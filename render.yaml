services:
  - type: web
    name: numericode-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    # Run database migrations as part of every deploy — this runs BEFORE the
    # service starts and blocks startup until it completes. It fails the
    # deploy loudly (rather than silently starting with a missing schema) and
    # uses whatever DATABASE_URL is set in this service's environment.
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
