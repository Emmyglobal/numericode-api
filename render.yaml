services:
  - type: web
    name: numerycode-api
    runtime: node
    plan: free
    # Pin to Node.js 18 — required for native fetch() and AbortSignal.timeout()
    # used by flutterwave.service.ts and paystack.service.ts. Without this,
    # Render's default (which may be < 18) causes "fetch is not defined" → 502.
    nodeVersion: '18'
    buildCommand: npm install && npm run build
    # Run database migrations as part of every deploy. Two mechanisms are used
    # so it works regardless of how the service is deployed:
    #   * preDeployCommand  – used when this service is Blueprint-managed
    #   * `npm run setup`   – used when the service is manually configured
    #                        (the Start Command in the Render dashboard)
    # Both call db:migrate, which is idempotent (CREATE TABLE IF NOT EXISTS).
    preDeployCommand: npm run db:migrate
    # The preDeployCommand above already runs migrations once before the service
    # starts — do NOT re-run them in the start command. Adding migration to the
    # start path delays port binding past Render's port-scan timeout (free tier),
    # which causes "Application exited early" even though the server eventually
    # listens. Just `npm start` is enough.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # ── Payments ──────────────────────────────────────────────────────────
      # PAYMENT_PROVIDER: 'flutterwave' for new checkouts, 'paystack' as rollback.
      # Must be set in the Render dashboard (not auto-generated).
      - key: PAYMENT_PROVIDER
        value: flutterwave
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_SECRET_HASH
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # ── Email ─────────────────────────────────────────────────────────────
      - key: EMAIL_FROM
        value: noreply@numerycode.com
      - key: EMAIL_FROM_NAME
        value: NumeryCode
      - key: CONTACT_EMAIL_TO
        sync: false
